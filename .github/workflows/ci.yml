name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-hidumper-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned nightly + build-std)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-01-22
          components: rustfmt, clippy, rust-src

      - name: Rustfmt check (hidumper)
        run: |
          rustfmt --version
          rustfmt --check kernel/extended/hidumper/rust/lib.rs

      - name: Rust smoke compile (hidumper)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          rustc --version
          cargo +nightly build \
            --manifest-path kernel/extended/hidumper/rust/Cargo.toml \
            --target thumbv7a-none-eabi \
            -Z build-std=core,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem

      - name: Clippy (hidumper)
        run: |
          cargo +nightly clippy \
            --manifest-path kernel/extended/hidumper/rust/Cargo.toml \
            --target thumbv7a-none-eabi \
            -Z build-std=core,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem \
            -- -D warnings
