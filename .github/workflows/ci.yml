name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-hidumper-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7a-none-eabi

      - name: Rustfmt check (hidumper)
        run: |
          rustfmt --version
          rustfmt --check kernel/extended/hidumper/rust/lib.rs

      - name: Rust smoke compile (hidumper)
        run: |
          rustc --version
          rustc \
            --crate-type=lib \
            --emit=obj \
            -D warnings \
            -C panic=abort \
            -C opt-level=2 \
            -C relocation-model=static \
            --target thumbv7a-none-eabi \
            kernel/extended/hidumper/rust/lib.rs \
            -o /tmp/hidumper_rust.o

      - name: Clippy (hidumper)
        run: |
          cargo clippy \
            --manifest-path kernel/extended/hidumper/rust/Cargo.toml \
            --target thumbv7a-none-eabi \
            -- -D warnings
